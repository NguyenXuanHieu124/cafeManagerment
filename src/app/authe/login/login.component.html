<form class="login" [formGroup]="loginForm">
  <img class="img" src="../../../assets/icon/logo-login.png" alt="">
  <h2>Welcome to CONO</h2>
  <p class="helping">helping you to order coffee</p>
  <div class="form">
    <div class="form-ip">
      <label>USERNAME</label>
      <br>
      <input type="text" #username formControlName="username" required><i class="fa fa-user"></i>
      <!-- <div *ngIf="loginForm.controls.username.invalid && (loginForm.controls.username.dirty || loginForm.controls.username.touched)"
        class="alert alert-danger">
        <div *ngIf="loginForm.controls.username.errors.required">
          * Username is required.
        </div>
        <div *ngIf="loginForm.controls.username.errors.minlength">
          * Username must be at least 8 characters long.
        </div>
        <div *ngIf="loginForm.controls.username.errors.maxlength">
          * Username cannot be more than 50 characters long.
        </div>
      </div> -->
    </div>
    <div class="form-ip">
      <label>PASSWORD</label>
      <br>
      <input type="password" #pass formControlName="password" required><i class="fa fa-key"></i>
      <!-- <div *ngIf="loginForm.controls.password.invalid && (loginForm.controls.password.dirty || loginForm.controls.password.touched)"
        class="alert alert-danger">
        <div *ngIf="loginForm.controls.password.errors.required">
          * Password is required.
        </div>
        <div *ngIf="loginForm.controls.password.errors.minlength">
          * Password must be at least 8 characters long.
        </div>
        <div *ngIf="loginForm.controls.password.errors.maxlength">
          * Password cannot be more than 50 characters long.
        </div>
        <div *ngIf="loginForm.controls.password.errors.pattern">
          * Your password must contain at least one uppercase, one lowercase, and one number.
        </div>
      </div> -->
    </div>
  </div>
  <button class="btn" (click)="login(username.value,pass.value)" [disabled]="!loginForm.valid">LOGIN</button>
</form>
